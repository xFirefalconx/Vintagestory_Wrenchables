name: Bug report
description: Create a report to help with improvements
title: "[Crash?] V[?.?.?] Bug name"
assignees:
  - xFirefalconx
type: Bug
body:
  - type: dropdown
    id: crash
    attributes:
      label: Does the game crash?
      description: Choose "Crash" if the game or server closes unexpectedly. If so, please also put [Crash] at the start of the issue title.
      options:
        - No crash
        - Crash
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Vintage Story version
      placeholder: "1.22.0"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Wrenchables version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer (client)
        - Multiplayer (server)
        - Multiplayer (both client and server)
        - Singleplayer and Multiplayer (client)
        - Singleplayer and Multiplayer (server)
        - All of the above
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: input
    id: other-mods
    attributes:
      label: Other mods installed that touch crates
      placeholder: "None, or list them"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please attach any logs that help narrow down the issue (client-main.log or server-main.log in the game's Logs folder).
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
